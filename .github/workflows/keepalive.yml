name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    # A small weekly repository activity commit prevents a public repository's
    # scheduled workflows from becoming inactive after a long period with no changes.
    - cron: "37 3 * * 0"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update weekly activity marker
        shell: bash
        run: |
          mkdir -p status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > status/last-activity.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-activity.txt
          git commit -m "chore: keep scheduled workflow active"
          git push
